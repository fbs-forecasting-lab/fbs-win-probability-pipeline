{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Private constrained explanations and separate moneyline benchmarking. No schedules, delivery, model fitting or forecast approval.",
  "Parameters": {
    "ProjectBucket": {
      "Type": "String"
    },
    "ProjectPrefix": {
      "Type": "String",
      "Default": "initial-demo"
    },
    "CodeBucket": {
      "Type": "String"
    },
    "CodeKey": {
      "Type": "String"
    },
    "ModelId": {
      "Type": "String",
      "AllowedPattern": "[0-9a-f]{64}"
    },
    "TrainingTokenSha256": {
      "Type": "String",
      "AllowedPattern": "[0-9a-f]{64}"
    },
    "ApprovedModelReference": {
      "Type": "String"
    },
    "MarketSecretArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:fbs/(the-odds-api-key|odds-api-key)-[A-Za-z0-9]+"
    }
  },
  "Conditions": {
    "HasMarketSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "MarketSecretArn"
            },
            ""
          ]
        }
      ]
    }
  },
  "Resources": {
    "ExplanationLogs": {
      "Type": "AWS::Logs::LogGroup",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "LogGroupName": "/aws/lambda/fbs-stakeholder-explanation",
        "RetentionInDays": 14
      }
    },
    "ExplanationRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "fbs-stakeholder-explanation-execution",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "ScopedStakeholderAccess",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetBucketPublicAccessBlock"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/monitoring/runs/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/explanations/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}"
                  },
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": [
                        {
                          "Fn::Sub": "${ProjectPrefix}/stakeholder/explanations/*"
                        }
                      ]
                    },
                    "NumericLessThanEquals": {
                      "s3:max-keys": "1"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:PutObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/explanations/*"
                    }
                  ]
                },
                {
                  "Effect": "Deny",
                  "Action": [
                    "s3:PutObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/explanations/*"
                    }
                  ],
                  "Condition": {
                    "StringNotEquals": {
                      "s3:if-none-match": "*"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/fbs-stakeholder-explanation:*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "bedrock:InvokeModel"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0"
                  }
                }
              ]
            }
          }
        ]
      }
    },
    "Explanation": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": [
        "ExplanationLogs"
      ],
      "Properties": {
        "FunctionName": "fbs-stakeholder-explanation",
        "Runtime": "python3.14",
        "Architectures": [
          "x86_64"
        ],
        "Handler": "src.pipeline.cloud_explanation.handler",
        "Role": {
          "Fn::GetAtt": [
            "ExplanationRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "CodeBucket"
          },
          "S3Key": {
            "Ref": "CodeKey"
          }
        },
        "MemorySize": 512,
        "Timeout": 90,
        "ReservedConcurrentExecutions": 1,
        "EphemeralStorage": {
          "Size": 512
        },
        "RuntimeManagementConfig": {
          "UpdateRuntimeOn": "FunctionUpdate"
        },
        "Environment": {
          "Variables": {
            "FBS_S3_BUCKET": {
              "Ref": "ProjectBucket"
            },
            "FBS_S3_PREFIX": {
              "Ref": "ProjectPrefix"
            },
            "OPENBLAS_NUM_THREADS": "1",
            "OMP_NUM_THREADS": "1",
            "PROVIDER_MODEL_ID": "amazon.nova-micro-v1:0"
          }
        }
      }
    },
    "ExplanationAsync": {
      "Type": "AWS::Lambda::EventInvokeConfig",
      "Properties": {
        "FunctionName": {
          "Ref": "Explanation"
        },
        "Qualifier": "$LATEST",
        "MaximumRetryAttempts": 0,
        "MaximumEventAgeInSeconds": 60
      }
    },
    "BenchmarkLogs": {
      "Type": "AWS::Logs::LogGroup",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "LogGroupName": "/aws/lambda/fbs-sportsbook-benchmark",
        "RetentionInDays": 14
      }
    },
    "BenchmarkRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "fbs-sportsbook-benchmark-execution",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "ScopedStakeholderAccess",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetBucketPublicAccessBlock"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/weekly/runs/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/cloud-ingestion/runs/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/cloud-modeling/models/${ModelId}/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/cloud-modeling/training/${TrainingTokenSha256}/claim.json"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/cloud-modeling/training/${TrainingTokenSha256}/complete.json"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2021/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2022/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2023/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2024/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2025/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/raw/cfbd/games/season=2026/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/market-captures/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/benchmarks/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:ListBucket"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}"
                  },
                  "Condition": {
                    "StringLike": {
                      "s3:prefix": [
                        {
                          "Fn::Sub": "${ProjectPrefix}/stakeholder/market-captures/*"
                        },
                        {
                          "Fn::Sub": "${ProjectPrefix}/stakeholder/benchmarks/*"
                        },
                        {
                          "Fn::Sub": "${ProjectPrefix}/weekly/runs/*"
                        },
                        {
                          "Fn::Sub": "${ProjectPrefix}/raw/cfbd/games/season=2026/*"
                        }
                      ]
                    },
                    "NumericLessThanEquals": {
                      "s3:max-keys": "1"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:PutObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/market-captures/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/benchmarks/*"
                    }
                  ]
                },
                {
                  "Effect": "Deny",
                  "Action": [
                    "s3:PutObject"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/market-captures/*"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:s3:::${ProjectBucket}/${ProjectPrefix}/stakeholder/benchmarks/*"
                    }
                  ],
                  "Condition": {
                    "StringNotEquals": {
                      "s3:if-none-match": "*"
                    }
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/fbs-sportsbook-benchmark:*"
                  }
                },
                {
                  "Fn::If": [
                    "HasMarketSecret",
                    {
                      "Effect": "Allow",
                      "Action": [
                        "secretsmanager:GetSecretValue"
                      ],
                      "Resource": {
                        "Ref": "MarketSecretArn"
                      }
                    },
                    {
                      "Ref": "AWS::NoValue"
                    }
                  ]
                }
              ]
            }
          }
        ]
      }
    },
    "Benchmark": {
      "Type": "AWS::Lambda::Function",
      "DependsOn": [
        "BenchmarkLogs"
      ],
      "Properties": {
        "FunctionName": "fbs-sportsbook-benchmark",
        "Runtime": "python3.14",
        "Architectures": [
          "x86_64"
        ],
        "Handler": "src.pipeline.cloud_benchmark.handler",
        "Role": {
          "Fn::GetAtt": [
            "BenchmarkRole",
            "Arn"
          ]
        },
        "Code": {
          "S3Bucket": {
            "Ref": "CodeBucket"
          },
          "S3Key": {
            "Ref": "CodeKey"
          }
        },
        "MemorySize": 1536,
        "Timeout": 180,
        "ReservedConcurrentExecutions": 1,
        "EphemeralStorage": {
          "Size": 512
        },
        "RuntimeManagementConfig": {
          "UpdateRuntimeOn": "FunctionUpdate"
        },
        "Environment": {
          "Variables": {
            "FBS_S3_BUCKET": {
              "Ref": "ProjectBucket"
            },
            "FBS_S3_PREFIX": {
              "Ref": "ProjectPrefix"
            },
            "OPENBLAS_NUM_THREADS": "1",
            "OMP_NUM_THREADS": "1",
            "APPROVED_MODEL_REFERENCE": {
              "Ref": "ApprovedModelReference"
            },
            "MARKET_SECRET_ARN": {
              "Ref": "MarketSecretArn"
            }
          }
        }
      }
    },
    "BenchmarkAsync": {
      "Type": "AWS::Lambda::EventInvokeConfig",
      "Properties": {
        "FunctionName": {
          "Ref": "Benchmark"
        },
        "Qualifier": "$LATEST",
        "MaximumRetryAttempts": 0,
        "MaximumEventAgeInSeconds": 60
      }
    }
  }
}
